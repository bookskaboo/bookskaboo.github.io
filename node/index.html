  <body>
    <div id="root">
      <div id="boot-status" style="position:fixed;inset:0;display:grid;place-content:center;background:#191b1f;color:#a5abb3;font:12px monospace;letter-spacing:1px;text-align:center">
        <b style="color:#e5c36b;margin-bottom:10px">NODE: ANOTHER FACTORY GAME</b>
        <span>Loading game. Please hold your expansion plans.</span>
      </div>
    </div>
    <script>
      (() => {
        const report = (label, value) => {
          const message = label + ': ' + (value && (value.stack || value.message) || String(value));
          const status = document.getElementById('boot-status');
          if (status) status.innerHTML = '<b style="color:#ef7c8c;margin-bottom:10px">The game could not load</b><span style="max-width:700px;white-space:pre-wrap">' + message.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</span>';
          fetch('/__client-error', { method: 'POST', headers: { 'content-type': 'text/plain' }, body: message }).catch(() => {});
        };
        window.addEventListener('error', event => report('window.error', event.error || event.message));
        window.addEventListener('unhandledrejection', event => report('unhandledrejection', event.reason));
      })();
    </script>
  </body>
