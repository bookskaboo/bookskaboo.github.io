<header class="masthead"><span class="wordmark">NODE <small>Another Factory Game</small></span><span class="badge">Proposal · local review</span></header>
<section class="intro"><div><h1>Map terrain tiles and spawning rules</h1><p>Four quiet surfaces for the whole Map Node playfield. The factory should remain the most distracting thing here.</p></div><p class="scope">Planning decisions recorded<br>Game integration pending</p></section>
<nav aria-label="Proposal sections"><a href="#art">Art test pages</a><a href="#rules">Resource rules</a><a href="#spawning">Game start spawning</a><a href="#delivery">Implementation proposal</a></nav>
<section id="art"><header class="section-heading"><h2>Art test pages</h2><span>Broader ground forms · revised draft for review</span></header>
<div class="terrain-tabs" role="group" aria-label="Terrain test page">${e.map(e=>`<button data-terrain="${e}" aria-pressed="false">${t[e]}</button>`).join(``)}<button id="compare" aria-pressed="false">Compare all four</button></div>
<div class="toolbar"><label>Shape draft <select id="draft" aria-label="Shape draft"><option value="natural">Broad natural forms</option><option value="initial">Initial small marks</option></select></label><label><input id="grid" type="checkbox" checked> 32-unit grid</label><label><input id="context" type="checkbox" checked> Production nodes and cables</label><label><input id="dense" type="checkbox"> Dense layout</label><label>Zoom <select id="zoom"><option value="1">100%</option><option value="0.5">50%</option><option value="1.5">150%</option></select></label><label>Detail strength <select id="strength"><option value="1">Quiet default</option><option value="0.5">Half detail</option><option value="2">Stress comparison</option></select></label></div>
<div id="art-fields" class="fields"></div>
<p class="note">Illustrative Production nodes, sockets and cables sit above the terrain and grid. No art shape blocks building. The revised draft repeats a 768-unit tile with connected ground forms; the initial draft retains its 256-unit marks. Four variants per terrain are available in each draft. These are art specimens, not a running game.</p>
<details><summary>Tile sheet and seams</summary><p>Four variants per terrain, then a repeated field. Revised ground forms wrap across tile edges; the initial marks keep plain edge tones. Decorative cracks and grass are painted ground, not resource nodes.</p><div id="tiles" class="tiles"></div></details>
</section>
<section id="rules"><header class="section-heading"><h2>Resource rules</h2><span>Agreed design · pending runtime implementation</span></header>
<p>Percentages multiply the capacity expected under current rules. They apply to starting stock and the lasting reserve maximum, not node count or extraction speed. Your Badlands correction is recorded as 50% of expected capacity.</p>
<div class="table-scroll"><table><caption>Terrain multipliers</caption><thead><tr><th scope="col">Terrain</th><th scope="col">Forest stock and cap</th><th scope="col">Forest regeneration</th><th scope="col">Stone, Copper, Iron</th><th scope="col">Eligible Mythril</th></tr></thead><tbody>${e.map(e=>`<tr><th scope="row">${t[e]}</th><td>${e===`badlands`?`No Forest spawn`:n[e].forest*100+`%`}</td><td>${e===`badlands`?`Not applicable`:r[e]*100+`% of default`}</td><td>${n[e].mineral*100}% stock and cap</td><td>${n[e].mineral*100}% stock and cap</td></tr>`).join(``)}</tbody></table></div>
<p class="note">Mythril appears only where the existing rules supply it, including its linked Dwarven settlement. Terrain creates no new Mythril source. Mineral regeneration and suppression rates stay unchanged. Lakes, infinite Golem reserves and player-created Drill deposits keep their current rules.</p>
<div class="calculator"><h3>Starting reserve example</h3><div class="toolbar"><label>Map tier <select id="tier">${Array.from({length:10},(e,t)=>`<option value="${t}" ${t===4?`selected`:``}>${t===0?`Home`:t}</option>`).join(``)}</select></label><label><input id="dwarven" type="checkbox" checked> Applicable Dwarven settlement</label></div><p id="baseline"></p><div id="example"></div><p class="note">Base-game analytical example. The Dwarven switch controls Mythril eligibility only; it does not place a settlement. Home has no Dwarven settlement. Corner maps are shown in the spawning specimen and retain their current resource exclusions.</p></div>
</section>
<section id="spawning"><header class="section-heading"><h2>Game start spawning</h2><span>Seeded and fixed for the save</span></header>
<p>Home and all four corners are Grassland. Keep 31 Grassland, 30 Badlands, 30 Desert and 30 Rocky maps in the standard 11 × 11 world. The five fixed Grassland maps count toward the 31; shuffle the remaining 116 assignments with the world seed.</p>
<div class="world-layout"><div><div class="toolbar"><label>World seed <input id="seed" type="number" value="2718" min="0" max="4294967295" step="1"></label><button id="generate">Preview seed</button><button id="export">Download rule snapshot</button></div><div id="world" class="world" aria-label="Full terrain assignment author review"></div></div><aside><h3>Assignment check</h3><p id="world-summary" role="status" aria-live="polite"></p><div class="legend">${e.map(e=>`<span><i style="background:${d[e].accent}"></i>${t[e]}</span>`).join(``)}</div><p>H is Home. C marks the four corners. Labels: B Badlands, G Grassland, D Desert, R Rocky.</p><p>Author review shows every assignment. The proposed player map keeps unexplored terrain hidden until discovered.</p></aside></div>
<ol class="steps"><li>Compute existing special-map and encounter assignments unchanged, with their existing seed stream.</li><li>Use a separate terrain seed stream. Reserve Home and corners, then shuffle the exact remaining quotas.</li><li>Store a terrain rule version and complete assignment at game creation. Later exploration reads that assignment; it never rerolls terrain.</li><li>When creating a sector, apply the saved terrain to eligible starting reserves and the Forest rate. Preserve existing exclusions, guarded links and suppression rules.</li><li>Keep art variation deterministic and separate from resource placement. Reload, imports, travel, undo and delayed exploration must preserve the result.</li></ol>
<p class="note">The specimen demonstrates terrain assignment and arithmetic only. Encounter placement, solvability and interactions with the planned border obstructions still need combined generator checks. Exact 30-per-terrain quotas are for the standard world; larger mod grids need a reviewed scaling policy.</p>
</section>
<section id="delivery"><header class="section-heading"><h2>Implementation proposal</h2><span>Review before game integration</span></header>
<div class="delivery-grid"><article><h3>Rendering</h3><p>Use one terrain per Map Node across the entire field, including Area Expansion. Layer ground, terrain detail, completed-hole ground and border terrain beneath the grid, cables, node bodies, sockets and interaction feedback. Keep the art static and cache repeated tiles.</p><p>Keep tile contrast below the grid and factory connections. Check all four variants at several zoom levels, crowded sockets, placement ghosts, warnings and the three proposed border types.</p></article><article><h3>Resources and compatibility</h3><p>Apply the terrain multiplier after the current map/mod baseline, rounded once to whole reserve units. An absent resource stays absent. Treat zero-cap Forests as no spawn. Apply the Forest multiplier to the default natural regeneration rate, then retain research/mod rate multipliers.</p><p>Preserve paid Tree Planter output and costs. Existing saves keep their current rules everywhere, including unexplored maps. New terrain applies only to new games. Training and explicit mod overrides need separate integration checks.</p></article><article><h3>Acceptance before delivery</h3><p>Verify exact counts, five fixed Grassland maps, stable seed results, changed-seed variation, zero Badlands Forests and the full capacity matrix. Test guarded minerals and resource exclusions, save/load and future exploration, the legacy boundary and field expansion.</p><p>Run a multi-seed progression and border-layout sweep, then normal gameplay for Desert Wood and early Badlands supply. Preserve successful factory branches and export resource totals and elapsed game time. This proposal is not balance evidence.</p></article><article><h3>Remaining review</h3><p>The broader natural shape direction is agreed. This revised artwork is ready for review of contrast, scale and repetition; use Shape draft to compare the initial marks. Proposed technical details still need implementation review: rounding, regeneration composition, hidden-map presentation, mod override precedence and larger-world quotas.</p><p>The starting stock/cap matrix, standard-world quotas, Home/corner Grassland and new-games-only compatibility are recorded design decisions.</p></article></div>
</section>
