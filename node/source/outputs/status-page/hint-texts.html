 outpost`,body:`Travel between activated maps is free. A rare administrative success.`,instruction:`Click Travel to node.`},"expansion-return":{title:`Return Home`,body:`The outpost fills its Cart while you travel. A Cart holds 20 solid items.`,instruction:`Open Map, select H, then click Travel to node.`},"expansion-outpost":{title:`Return to the sending map`,body:`A Road initially sends from the map where you place it.`,instruction:`Open Map and travel to W1.`},"expansion-road-place":{title:`Build a Road pair`,body:`Both endpoints need clear space. In your factory, right-click either Road to reverse the route. This disconnects both endpoints’ cables; reconnect them for the new direction.`,instruction:`Open Build, choose Road, and place it at the highlighted east edge.`},"expansion-road-feed":{title:`Connect the sending Cart`,body:`The Cart’s arrow points toward its output socket. Put Filters or Joints before the Cart. Wood waits here until the receiving Cart has room.`,instruction:`Drag directly from the Cart output to the Road input.`},"expansion-home-receive":{title:`Find the receiving Cart`,body:`The paired Road is on Home’s west edge beside an empty Cart.`,instruction:`Open Map and travel to H.`},"expansion-deliver":{title:`Unload into the Home Cart`,body:`The arrow’s tail marks the input side. Put routing nodes after the Cart. At Cart level the Road moves one item every five seconds.`,instruction:`Drag directly from the Road output to the Cart input.`},"expansion-complete":{title:`Wood reached the Home Cart`,body:`Each Road pair carries one solid material. Truck and Train upgrades raise capacity and freight rates.`,instruction:``},"build-open":{title:`Make your first Simple Core`,body:`Use Wood and Copper to make Simple Cores, then spend them on Assembler research.`,instruction:`Open Build.`},"build-explain":{body:`Nodes are free to build. The layout is your responsibility.`,instruction:`Select Extractor in Build.`},"build-place":{body:`Press Escape or right-c
