<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NODE Milestone Modal Preview</title>
    <style>
      body { background-color: #111820; background-image: radial-gradient(#536b803b 1px, transparent 1px); background-size: 24px 24px; }
      .milestone-preview-toolbar {
        position: absolute; inset: 0 0 auto; z-index: 200; min-height: 68px; padding: 8px 16px;
        display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px;
        background: #17222e; border-bottom: 1px solid #32465a;
      }
      .milestone-preview-toolbar h1 { font-size: 15px; margin: 0; }
      .milestone-preview-toolbar label { display: flex; align-items: center; gap: 8px; font-size: 12px; }
      .milestone-preview-toolbar select, .milestone-preview-toolbar button {
        border: 1px solid #48617a; border-radius: 5px; padding: 5px 8px; color: #e4edf6; background: #203146;
      }
      .milestone-preview-status { margin: 104px auto 0; max-width: 440px; padding: 20px; color: #cad8e3; text-align: center; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/preview/milestoneModals.tsx"></script>
  </body>
</html>
